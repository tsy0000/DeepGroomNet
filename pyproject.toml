[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deepgroomnet"
version = "1.0.0"
description = "Multi-agent framework for frame-level mouse behaviour segmentation from top-view open-field video"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "opencv-python>=4.8",
  "pyyaml>=6.0",
  "torch>=2.0",
  "einops>=0.7",
  "tqdm>=4.65",
]

[project.optional-dependencies]
detector = ["ultralytics>=8.0"]
pose = ["deeplabcut>=2.3", "keypoint_moseq>=0.6"]
gui = ["streamlit>=1.30"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["deepgroomnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
