CLASSES:
  names: [Locomote, Rear, FaceGroom, BodyGroom, background]
  background_index: 4
CLIP:
  num_input_frames: 32
  target_size: 224
  norm_mean: 0.45
  norm_std: 0.225
  yolo_crop: true
MODEL:
  backbone: tadaconvnextv2_tiny
  pretrained: null
  cpam: true
  stsa: true
TRAIN:
  epochs: 20
  batch_size: 4
  grad_accum: 2
  lr: 0.0001
  head_lr_mult: 10.0
  weight_decay: 0.0005
  samples_per_class: 3000
  val_samples_per_class: 200
  clips_per_video: 60
  num_workers: 4
  seed: 42
  select_metric: auroc
LOSS:
  alpha: 0.9
  beta: 0.1
  label_smoothing: 0.05
