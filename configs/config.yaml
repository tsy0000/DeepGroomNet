

DATA:
  openfield_roots:
    - "E:/tsy/datasetssap3"
    - "E:/tsy/downloaddatasets"
  opto_root: "E:/tsy/datasetsopto"
  homecage_root: "E:/tsy/clipped_database"
  clip_output_root: "D:/DeepGroomNet_v2/outputs/clips"
  meta_root: "D:/DeepGroomNet_v2/outputs/meta"
  use_pre_extracted: true

CLIP:
  num_input_frames: 32
  orig_segment_len: 45
  fps: 30
  clip_interval: 15
  target_size: 224
  boundary_jitter: true
  jitter_frames: 4
  sliding_windows_per_uniform: 1
  yolo_conf: 0.1
  yolo_expand: 1.2
  yolo_weights: "C:/Users/WIN10/PycharmProjects/mouseaction/DeepBehavior/runs/detect/train/weights/best.pt"
  aug_crop_scale: [0.75, 1.0]
  aug_brightness: 0.2
  aug_contrast: 0.2
  aug_saturation: 0.2
  aug_hue: 0.0
  aug_erase_prob: 0.1
  aug_rotate_deg: 15.0
  mean: [0.6220, 0.6219, 0.6165]
  std:  [0.2621, 0.2661, 0.2678]
  motion_channel: true
  motion_mean: 0.0085
  motion_std: 0.044
  flow_channel: true
  flow_root: "D:/DeepGroomNet_v2/outputs/flow"

KEYPOINTS:
  root: "E:/tsy/keypointjson_to_csv"
  enabled: true
  use_parts: ~
  min_likelihood: 0.5
  render_prior: true
  render_sigma: 0.6
  render_heatmap_size: 32

CLASSES:
  openfield: ["background", "Locomote", "Rear", "FaceGroom", "BodyGroom", "Defecate"]
  openfield_keep: ["Locomote", "Rear", "FaceGroom", "BodyGroom", "background"]
  homecage: ["drink", "eat", "groom", "hang", "micromovement", "rear", "rest", "walk"]

MODEL:
  backbone: "TAdaConvNeXtV2_Tiny"
  init_weights: "C:/Users/WIN10/PycharmProjects/mouseaction/DeepBehavior/TAdaConv/tadaconvnextv2_tiny_in1k_k400_79.6.pyth"
  num_classes: 5
  attention: "motion_stat"
  attention_reductions:
    cbam: 16
    coordinate: 32
    motion: 16
    motion_stat: 16
  attention_center_prior: 0.25
  attention_mask_prior: 0.8
  attention_kp_prior: 0.5
  attention_positions: [0,1,2]
  dropout: 0.4

LOSS:
  head_mode: "multilabel"
  binary_gamma: 0.0
  binary_label_smoothing: 0.05
  binary_alpha_mode: "deepethogram"
  binary_eval_threshold: 0.5
  binary_exclusivity_pairs: [[2, 3]]
  binary_exclusivity_weight: 0.05
  l2sp:
    enabled: true
    alpha: 0.00001
    beta: 0.001
  use_focal: true
  focal_gamma: 2.0
  focal_alpha_balanced: true
  focal_alpha_mode: "deepethogram"
  focal_alpha_min: 0.05
  rare_class_bias_init: true
  label_smoothing: 0.1
  semantic_prior: false
  semantic_weight: 0.1
  semantic_ose: true
  semantic_ose_alpha: 0.5
  semantic_oagm: true
  semantic_oagm_lambda: 2.0
  semantic_oagm_hops: 2
  semantic_oagm_tau: 0.5

TRAIN:
  epochs: 40
  batch_size: 2
  grad_accum: 4
  lr: 0.0002
  weight_decay: 0.0005
  grad_clip: 5.0
  grad_clip_headonly: 50.0
  warmup_epochs: 3
  lr_schedule: "cosine"
  early_stop_patience: 10
  num_workers: 8
  pin_memory: false
  persistent_workers: true
  seed: 42
  mixed_precision: false
  sampler_weighted: true
  sampler_quota: false
  aux_homecage: true
  aux_weight: 0.3
  aux_every: 2
  split:
    val_ratio: 0.15
    test_ratio: 0.15
  transfer_stages:
    stage1_epochs: 6
    stage1_lr: 0.01
    homecage_epochs: 0
  test_aug:
    hflip: true
    multi_crop: true
    crop_scales: [0.9, 1.0]
  diagnostics: true
  diagnostics_every: 2
  diagnostics_val_batches: 8

POSTPROCESS:
  smoothing: "sequence"
  vote_window: 5
  median_window: 7
  seq_min_bout: 5
  sakamoto_filter: true
  sakamoto_min_isolated: 4
  sakamoto_min_gap: 6
  sakamoto_min_switch: 4
  transition_prior: true
  syllable_min_len: 1
  threshold_tuning: true
  threshold_candidates: 100
  threshold_passes: 2
  threshold_min_f1: 0.05

INFER:
  window_mode: "sliding"
  crop_mode: "window"
  yolo_weights: "C:/Users/WIN10/PycharmProjects/mouseaction/DeepBehavior/runs/detect/train/weights/best.pt"
  syllable_csv_root: ""
  video_root: ""

LLM:
  provider: "none"
  ollama_base_url: "http://localhost:11434"
  ollama_model: "qwen2.5:7b"
  api_base_url: ""
  api_model: "deepseek-chat"
  api_key: ""
  temperature: 0.3
  max_tokens: 1500
  language: "zh"

SELFTRAIN:
  enabled: false
  target_classes: ["FaceGroom", "BodyGroom"]
  min_conf: 0.85
  min_len: 8
  max_samples: 200

OUTPUT:
  checkpoint_dir: "D:/DeepGroomNet_v2/outputs/checkpoints"
  log_dir: "D:/DeepGroomNet_v2/outputs/logs"
  metric_dir: "D:/DeepGroomNet_v2/outputs/metrics"
